name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug repo structure
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type d | sed -n '1,120p'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run contract tests
        run: |
          cd token-metrics-sdet-assignment/contracts
          forge --version
          forge install foundry-rs/forge-std --no-commit
          forge test -vvv

  api:
    name: API (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug repo structure
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type d | sed -n '1,120p'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run API tests
        env:
          PYTHONWARNINGS: ignore
        run: |
          cd token-metrics-sdet-assignment/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70 -W ignore
