name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug repo structure
        run: |
          pwd
          ls -la

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run contract tests
        run: |
          cd contracts
          forge --version
          # If forge-std is already committed, this will be quick.
          # If not, it installs it for CI.
          if [ ! -d "lib/forge-std" ]; then
            forge install foundry-rs/forge-std --no-commit
          fi
          forge test -vvv

  api:
    name: API (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug repo structure
        run: |
          pwd
          ls -la

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run API tests
        env:
          PYTHONWARNINGS: ignore
        run: |
          cd api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70 -W ignore
