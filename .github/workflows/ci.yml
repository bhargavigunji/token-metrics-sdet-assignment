name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug workspace
        run: |
          echo "PWD: $(pwd)"
          echo "Top-level:"
          ls -la
          echo "Find contracts:"
          find . -maxdepth 4 -type d -name contracts -print

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run contract tests
        run: |
          set -e
          CONTRACTS_DIR="$(find . -maxdepth 4 -type d -name contracts | head -n 1)"
          if [ -z "$CONTRACTS_DIR" ]; then
            echo "ERROR: contracts folder not found in repo checkout"
            echo "Repo tree (max depth 3):"
            find . -maxdepth 3 -type d -print
            exit 1
          fi

          echo "Using contracts dir: $CONTRACTS_DIR"
          cd "$CONTRACTS_DIR"

          forge --version

          # Ensure forge-std exists in CI
          if [ ! -d "lib/forge-std" ]; then
            forge install foundry-rs/forge-std --no-commit
          fi

          forge test -vvv

  api:
    name: API (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug workspace
        run: |
          echo "PWD: $(pwd)"
          echo "Top-level:"
          ls -la
          echo "Find api:"
          find . -maxdepth 4 -type d -name api -print

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run API tests
        env:
          PYTHONWARNINGS: ignore
        run: |
          set -e
          API_DIR="$(find . -maxdepth 4 -type d -name api | head -n 1)"
          if [ -z "$API_DIR" ]; then
            echo "ERROR: api folder not found in repo checkout"
            echo "Repo tree (max depth 3):"
            find . -maxdepth 3 -type d -print
            exit 1
          fi

          echo "Using api dir: $API_DIR"
          cd "$API_DIR"

          python -m pip install --upgrade pip
          pip install -r requirements.txt

          pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70 -W ignore
